    window.addEventListener("hashchange", route);

    // ===== 日期小工具 =====
    // Date -> "2026-09-29"（按本机时区，不用 toISOString，那个是 UTC 会差一天）
    function dateKey(d) {
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }
    // "2026-09-29" -> 当天 00:00 的 Date
    function parseKey(key) {
      const [y, m, d] = key.split("-").map(Number);
      return new Date(y, m - 1, d);
    }
    function todayKey() {
      return dateKey(new Date());
    }

    // 日历上选中的那天，默认今天；待办页和作息都跟着它走
    let selectedDate = todayKey();
    let viewYear = new Date().getFullYear();
    let viewMonth = new Date().getMonth();   // 0-11

    // ===== 日历 =====
    const yearTabs = document.getElementById("year-tabs");
    const monthTitle = document.getElementById("month-title");
    const calGrid = document.getElementById("cal-grid");
    const dayTitle = document.getElementById("day-title");
    const todayChip = document.getElementById("today-chip");
    const schedList = document.getElementById("sched-list");
    const routineTitle = document.getElementById("routine-title");
    const todoTitle = document.getElementById("todo-title");

    // 某天的中文标题："9月29日 · 周二"
    function dayLabel(key) {
      const d = parseKey(key);
      return `${d.getMonth() + 1}月${d.getDate()}日 · 周${WEEKDAYS[d.getDay()]}`;
    }

    function renderYearTabs() {
      const thisYear = new Date().getFullYear();
      yearTabs.innerHTML = "";
      [thisYear, thisYear + 1].forEach(y => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "seg-btn";
        btn.textContent = `${y} 年`;
        btn.setAttribute("aria-pressed", String(y === viewYear));
        btn.addEventListener("click", () => {
          viewYear = y;
          renderCalendar();
        });
        yearTabs.appendChild(btn);
      });
    }

    function renderMonth() {
      monthTitle.textContent = `${viewYear} 年 ${viewMonth + 1} 月`;
      calGrid.innerHTML = "";

      // 哪些天有任务，用来画小圆点
      const busyDays = new Set(todoList.map(t => t.date));
      const firstWeekday = new Date(viewYear, viewMonth, 1).getDay();   // 1 号是周几，前面留几个空格
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const today = todayKey();

      for (let i = 0; i < firstWeekday; i++) {
        calGrid.appendChild(document.createElement("span"));
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const key = dateKey(new Date(viewYear, viewMonth, day));
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cal-day";
        if (key === today) btn.classList.add("is-today");
        btn.setAttribute("aria-pressed", String(key === selectedDate));

        const busy = busyDays.has(key);
        btn.setAttribute("aria-label",
          `${viewMonth + 1}月${day}日${key === today ? "，今天" : ""}${busy ? "，有日程" : ""}`);

        const num = document.createElement("span");
        num.className = "cal-num";
        num.textContent = day;
        const mark = document.createElement("span");
        mark.className = "cal-mark";
        if (busy) {
          const dot = document.createElement("span");
          dot.className = "cal-dot";
          mark.appendChild(dot);
        }
        btn.append(num, mark);

        btn.addEventListener("click", () => {
          selectedDate = key;
          renderCalendar();
          loadActivity();
        });
        calGrid.appendChild(btn);
      }
    }

    // 选中那天的日程卡片
    function renderSchedule() {
      const isToday = selectedDate === todayKey();
      dayTitle.textContent = dayLabel(selectedDate);
      todayChip.hidden = !isToday;
      routineTitle.textContent = isToday ? "今日作息" : `${dayLabel(selectedDate)} 作息`;

      schedList.innerHTML = "";
      const tasks = todoList.filter(t => t.date === selectedDate);
      if (tasks.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "这天还没有日程";
        schedList.appendChild(empty);
        return;
      }
      const isPast = selectedDate < todayKey();   // "YYYY-MM-DD" 格式的字符串可以直接比大小
      tasks.forEach(item => {
        const li = document.createElement("li");
        if (item.completed) li.classList.add("is-done");
        else if (isPast) li.classList.add("is-past");

        const body = document.createElement("div");
        body.className = "sched-body";
        const title = document.createElement("div");
        title.className = "sched-title";
        title.textContent = item.task;
        const meta = document.createElement("div");
        meta.className = "sched-meta";
        meta.textContent = `添加于 ${formatTime(new Date(item.createdAt))}`;
        body.append(title, meta);

        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = item.completed ? "已完成" : isPast ? "已过" : "未完成";

        li.append(body, chip);
        schedList.appendChild(li);
      });
    }

    function renderCalendar() {
      renderYearTabs();
      renderMonth();
      renderSchedule();
    }

    function shiftMonth(delta) {
      const d = new Date(viewYear, viewMonth + delta, 1);   // Date 会自动处理跨年
      viewYear = d.getFullYear();
      viewMonth = d.getMonth();
      renderCalendar();
    }
    document.getElementById("prev-month").addEventListener("click", () => shiftMonth(-1));
    document.getElementById("next-month").addEventListener("click", () => shiftMonth(1));

    function showMessage(text) {
      messageEl.textContent = text;
    }

    // 列出（只列日历上选中那天的任务）
    function listTasks() {
      const isToday = selectedDate === todayKey();
      todoTitle.textContent = isToday ? "今日待办事件" : `${dayLabel(selectedDate)} 待办`;
      listEl.innerHTML = "";

      const tasks = todoList.filter(t => t.date === selectedDate);
      if (tasks.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "当前没有任务哦";
        listEl.appendChild(empty);
        return;
      }

      tasks.forEach((item, i) => {
        const li = document.createElement("li");
        if (item.completed) li.classList.add("completed");

        // 标记已完成：勾选框
        const label = document.createElement("label");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = item.completed;
        checkbox.addEventListener("change", () => mark(item.id));

        const body = document.createElement("span");
        body.className = "task-body";

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = `${i + 1}. ${item.task}`;   // 用 textContent，防止输入的内容被当成 HTML 执行

        // 时间记录：添加时间，完成后再显示完成时间
        const time = document.createElement("span");
        time.className = "task-time";
        time.textContent = item.completed
          ? `添加于 ${formatTime(new Date(item.createdAt))} · 完成于 ${formatTime(new Date(item.completedAt))}`
          : `添加于 ${formatTime(new Date(item.createdAt))}`;

        body.append(text, time);

        const status = document.createElement("span");
        status.className = "status";
        status.textContent = item.completed ? "[已完成]" : "[未完成]";

        label.append(checkbox, body, status);

        // 删除按钮
        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "small-btn delete-btn";
        deleteBtn.textContent = "删除";
        deleteBtn.setAttribute("aria-label", `删除任务 ${item.task}`);
        deleteBtn.addEventListener("click", () => remove(item.id));

        li.append(label, deleteBtn);
        listEl.appendChild(li);
      });
    }

    // 增加
    function add(taskName) {
      taskName = taskName.trim();   // 相当于 Python 的 .strip()
      if (!taskName) {
        showMessage("未输入事件");
        return;
      }
      todoList.push({
        id: nextId++, date: selectedDate, task: taskName,
        completed: false, createdAt: Date.now(), completedAt: null,
      });
      saveTodos();
      showMessage(`已添加 事件 ${taskName}`);
      listTasks();
    }

    // 标记已完成（再点一次可以取消）
    // 用 id 找任务：列表只显示某一天的任务，显示的序号和数组下标对不上
    function mark(id) {
      const item = todoList.find(t => t.id === id);
      item.completed = !item.completed;
      item.completedAt = item.completed ? Date.now() : null;
      saveTodos();
      showMessage(item.completed
        ? `已将任务${item.task}标记为已完成啦`
        : `已将任务${item.task}改回未完成`);
      listTasks();
    }

    // 删除
    function remove(id) {
      const index = todoList.findIndex(t => t.id === id);
      const [removed] = todoList.splice(index, 1);   // 相当于 Python 的 pop(index)
      saveTodos();
      showMessage(`已将任务${removed.task}删除了`);
      listTasks();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();   // 阻止表单提交刷新页面
      add(input.value);
      input.value = "";
      input.focus();
    });

    // ===== 电脑活动记录 =====
    // 浏览器本身读不到“电脑上开着哪个软件”，所以由 activity_tracker.py 在本机后台记录，
    // 网页通过它提供的接口 /api/activity 拿数据。页面也要由它打开（http://127.0.0.1:8765），
    // 直接双击打开 html 文件时拿不到数据，会显示使用说明。
    const activityListEl = document.getElementById("activity-list");
    const activityStateEl = document.getElementById("activity-state");
    const trackerAvailable = location.protocol.startsWith("http");

    // 秒数 -> "1小时5分" / "12分" / "40秒"
    function formatDuration(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      if (h) return `${h}小时${m}分`;
      if (m) return `${m}分`;
      return `${Math.max(1, Math.round(seconds))}秒`;
    }

    function hm(timestamp) {
      const d = new Date(timestamp * 1000);
      return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function showActivityHelp() {
      activityStateEl.textContent = "还没有连接到记录程序";
      activityListEl.innerHTML = "";
      const li = document.createElement("li");
      li.className = "empty activity-help";
      li.innerHTML = "在终端运行 <code>python3 stage2/activity_tracker.py</code>，" +
        "然后用浏览器打开 <code>http://127.0.0.1:8765</code>";   // 固定文字，没有用户输入，可以用 innerHTML
      activityListEl.appendChild(li);
      doingLineEl.hidden = true;
    }

    // 两次看电脑之间间隔不到 5 分钟，算同一段（和 tracker 判断“离开”的时间一致）
    const REST_MIN_SECONDS = 5 * 60;

    // 把一条条软件记录合并成“看电脑”时间段，中间的空档就是“休息”
    // 返回 [{ type: "pc" | "rest", start, end, apps: [用得最久的软件...] }]，时间单位是秒
    function buildRoutine(records, dayStart, dayEnd) {
      const sessions = [];
      [...records].sort((a, b) => a.start - b.start).forEach(r => {
        const last = sessions[sessions.length - 1];
        if (last && r.start - last.end < REST_MIN_SECONDS) {
          last.end = Math.max(last.end, r.end);
        } else {
          sessions.push({ start: r.start, end: r.end, usage: {}, records: [] });
        }
        const s = sessions[sessions.length - 1];
        s.usage[r.app] = (s.usage[r.app] || 0) + (r.end - r.start);
        s.records.push(r);   // 留着原始记录，点开“看电脑”时显示明细
      });

      const timeline = [];
      let cursor = dayStart;
      sessions.forEach(s => {
        const start = Math.max(s.start, dayStart);
        const end = Math.min(s.end, dayEnd);
        if (end <= start) return;
        if (start > cursor) timeline.push({ type: "rest", start: cursor, end: start });
        const apps = Object.entries(s.usage).sort((a, b) => b[1] - a[1]).map(([app]) => app);
        // 明细也裁到这一天之内（跨零点的记录只算当天那部分）
        const details = s.records
          .map(r => ({ app: r.app, start: Math.max(r.start, dayStart), end: Math.min(r.end, dayEnd) }))
          .filter(r => r.end > r.start);
        timeline.push({ type: "pc", start, end, apps, details });
        cursor = end;
      });
      if (dayEnd > cursor) timeline.push({ type: "rest", start: cursor, end: dayEnd });

      // 不到 1 分钟的碎片不显示
      return timeline.filter(seg => seg.end - seg.start >= 60);
    }

    // 秒级时间戳 -> "09:30"；一天的结束显示成 "24:00"
    function clockOf(timestamp, dayStart) {
      if (timestamp - dayStart >= 86400) return "24:00";
      return hm(timestamp);
    }

    function renderActivity(data) {
      const records = data.records;
      const isToday = selectedDate === todayKey();

      // 首页卡片的第 3 行：正在用的软件（只看今天）
      const current = isToday ? records.find(r => r.current) : null;
      if (current) {
        doingLineEl.textContent = `正在使用 ${current.app} · 已 ${formatDuration(current.end - current.start)}`;
        doingLineEl.hidden = false;
      } else if (isToday) {
        doingLineEl.hidden = true;
      }

      activityListEl.innerHTML = "";
      const dayStart = parseKey(selectedDate).getTime() / 1000;
      const nowSec = Date.now() / 1000;
      if (dayStart > nowSec) {
        activityStateEl.textContent = "这天还没到哦";
        return;
      }
      // 今天只统计到现在，过去的日子统计完整的 24 小时
      const dayEnd = isToday ? nowSec : dayStart + 86400;

      if (records.length === 0) {
        activityStateEl.textContent = isToday ? "今天还没有看电脑的记录" : "这天没有记录";
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = isToday ? "开着 activity_tracker.py 就会自动记录" : "这天没有打开记录程序";
        activityListEl.appendChild(empty);
        return;
      }

      const timeline = buildRoutine(records, dayStart, dayEnd);
      const pcTotal = timeline.filter(s => s.type === "pc").reduce((sum, s) => sum + (s.end - s.start), 0);
      activityStateEl.textContent =
        `${isToday && data.idle ? "暂时离开了电脑 · " : ""}看电脑共 ${formatDuration(pcTotal)}`;

      timeline.forEach((seg, i) => {
        const li = document.createElement("li");
        li.className = seg.type === "pc" ? "is-pc" : "is-rest";

        const time = document.createElement("span");
        time.className = "routine-time";
        const endText = isToday && i === timeline.length - 1 ? "现在" : clockOf(seg.end, dayStart);
        time.textContent = `${clockOf(seg.start, dayStart)} - ${endText}`;

        const label = document.createElement("span");
        label.className = "routine-label";
        label.textContent = seg.type === "pc" ? "看电脑" : "休息";

        const dur = document.createElement("span");
        dur.className = "activity-dur";
        dur.textContent = formatDuration(seg.end - seg.start);

        if (seg.type === "rest") {
          li.append(time, label, dur);
          activityListEl.appendChild(li);
          return;
        }

        // “看电脑”：整行是一个按钮，点一下展开这段时间里的使用明细
        const row = document.createElement("button");
        row.type = "button";
        row.className = "routine-row";

        const chevron = document.createElement("span");
        chevron.className = "routine-chevron";
        chevron.setAttribute("aria-hidden", "true");
        chevron.textContent = "›";

        // 这段时间里用得最多的前 3 个软件（软件名来自系统，同样用 textContent）
        const apps = document.createElement("span");
        apps.className = "routine-app";
        apps.textContent = seg.apps.slice(0, 3).join("、");

        row.append(chevron, time, label, apps, dur);

        const detail = buildRoutineDetail(seg, dayStart, isToday);
        detail.id = `routine-detail-${i}`;
        row.setAttribute("aria-controls", detail.id);

        // 每 15 秒自动刷新一次列表，用这段的开始时间记住哪些是展开的，刷新后保持展开
        const key = `${selectedDate}@${Math.floor(seg.start)}`;
        const setOpen = (open) => {
          row.setAttribute("aria-expanded", String(open));
          detail.hidden = !open;
          if (open) openRoutineKeys.add(key); else openRoutineKeys.delete(key);
        };
        setOpen(openRoutineKeys.has(key));
        row.addEventListener("click", () => setOpen(detail.hidden));

        li.append(row, detail);
        activityListEl.appendChild(li);
      });
    }

    const openRoutineKeys = new Set();

    // 一段“看电脑”的明细：按时间顺序列出每个软件用了多久
    function buildRoutineDetail(seg, dayStart, isToday) {
      const ul = document.createElement("ul");
      ul.className = "routine-detail";

      // 同一个软件被打断时 tracker 会记成好几条，这里把紧挨着的同名记录再合并一下
      const merged = [];
      seg.details.forEach(r => {
        const last = merged[merged.length - 1];
        if (last && last.app === r.app && r.start - last.end < 60) last.end = Math.max(last.end, r.end);
        else merged.push({ ...r });
      });

      merged.forEach((r, j) => {
        const li = document.createElement("li");

        const time = document.createElement("span");
        time.className = "routine-time";
        const isLast = isToday && j === merged.length - 1 && seg.end >= Date.now() / 1000 - 60;
        time.textContent = `${clockOf(r.start, dayStart)} - ${isLast ? "现在" : clockOf(r.end, dayStart)}`;

        const app = document.createElement("span");
        app.className = "routine-app";
        app.textContent = r.app;

        const dur = document.createElement("span");
        dur.className = "activity-dur";
        dur.textContent = formatDuration(r.end - r.start);

        li.append(time, app, dur);
        ul.appendChild(li);
      });
      return ul;
    }

    let activityRequestId = 0;   // 快速切换日期时，只采用最后一次请求的结果
    async function loadActivity() {
      if (!trackerAvailable) {
        showActivityHelp();
        return;
      }
      const id = ++activityRequestId;
      const date = selectedDate;
      try {
        const res = await fetch(`/api/activity?date=${date}`, { cache: "no-store" });
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        if (id === activityRequestId) renderActivity(data);
      } catch (e) {
        if (id !== activityRequestId) return;
        activityStateEl.textContent = "连接不上记录程序，确认 activity_tracker.py 还在运行";
        activityListEl.innerHTML = "";
        doingLineEl.hidden = true;
      }
    }

    document.getElementById("activity-refresh").addEventListener("click", loadActivity);
    document.getElementById("activity-clear").addEventListener("click", async () => {
      if (!trackerAvailable) return showActivityHelp();
      if (!confirm("确定清空今天的电脑活动记录吗？")) return;
      try {
        await fetch("/api/activity/clear", { method: "POST" });
      } catch (e) {}
      loadActivity();
    });

    updateClock();
    setInterval(updateClock, 1000);
    updateWeather();
    setInterval(updateWeather, WEATHER_CACHE_MS);
    renderProjectsHint();
    route();
    loadActivity();
    if (trackerAvailable) setInterval(loadActivity, 15000);   // 每 15 秒自动刷新一次活动记录
  </script>
</body>
</html>
